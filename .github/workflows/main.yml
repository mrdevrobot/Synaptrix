# Nome del workflow visualizzato su GitHub
name: Publish to NuGet

# --- Trigger ---
on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'                  # stable:      v1.2.3
      - 'v[0-9]+.[0-9]+.[0-9]+-alpha'             # pre-release: v1.2.3-alpha
      - 'v[0-9]+.[0-9]+.[0-9]+-alpha.[0-9]+'      #              v1.2.3-alpha.1
      - 'v[0-9]+.[0-9]+.[0-9]+-beta'              #              v1.2.3-beta
      - 'v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+'       #              v1.2.3-beta.1
      - 'v[0-9]+.[0-9]+.[0-9]+-preview'           #              v1.2.3-preview
      - 'v[0-9]+.[0-9]+.[0-9]+-preview.[0-9]+'    #              v1.2.3-preview.1
      - 'v[0-9]+.[0-9]+.[0-9]+-rc'                #              v1.2.3-rc
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'         #              v1.2.3-rc.1
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build_and_publish:
    environment: Production
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write   # richiesto da NuGet Trusted Publishing (OIDC)

    steps:
      # 1. Checkout con storia completa (necessario per version tag)
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Installa .NET
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 3. Deriva la versione dal tag e rileva se è pre-release
      - name: Resolve version from tag
        id: ver
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" == *-* ]]; then
            IS_PRERELEASE=true
          else
            IS_PRERELEASE=false
          fi
          echo "value=$VERSION"               >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE"  >> "$GITHUB_OUTPUT"

      # 4. Ripristina le dipendenze
      - name: Restore dependencies
        run: dotnet restore Synaptrix.slnx

      # 5. Imposta la variabile VERSION per i build
      - name: Set VERSION env var
        run: echo "VERSION=${{ steps.ver.outputs.value }}" >> "$GITHUB_ENV"

      # 6. Build dei progetti
      - name: Build Synaptrix.Core
        run: |
          dotnet build src/Synaptrix.Core/Synaptrix.Core.csproj --no-restore --configuration Release \
            ${VERSION:+-p:Version=$VERSION}

      - name: Build Synaptrix.Generator
        run: |
          dotnet build src/Synaptrix.Generator/Synaptrix.Generator.csproj --no-restore --configuration Release \
            ${VERSION:+-p:Version=$VERSION}

      - name: Build Synaptrix
        run: |
          dotnet build src/Synaptrix/Synaptrix.csproj --no-restore --configuration Release \
            ${VERSION:+-p:Version=$VERSION}

      - name: Build Tests
        run: |
          dotnet build tests/Synaptrix.Core.Tests/Synaptrix.Core.Tests.csproj --no-restore --configuration Release
          dotnet build tests/Synaptrix.Generator.Tests/Synaptrix.Generator.Tests.csproj --no-restore --configuration Release

      # 7. Esegui i test
      - name: Test
        run: |
          dotnet test tests/Synaptrix.Core.Tests/Synaptrix.Core.Tests.csproj --no-build --configuration Release
          dotnet test tests/Synaptrix.Generator.Tests/Synaptrix.Generator.Tests.csproj --no-build --configuration Release

      # --- Pubblicazione (solo su tag) ---

      # 8. Crea i pacchetti NuGet
      - name: Pack projects
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PACK_ARGS="-p:Version=${{ steps.ver.outputs.value }}"
          dotnet pack src/Synaptrix.Core/Synaptrix.Core.csproj           --no-build --configuration Release --output ./packages $PACK_ARGS
          dotnet pack src/Synaptrix.Generator/Synaptrix.Generator.csproj --no-build --configuration Release --output ./packages $PACK_ARGS
          dotnet pack src/Synaptrix/Synaptrix.csproj                     --no-build --configuration Release --output ./packages $PACK_ARGS

      # 9. Pubblica su NuGet con Trusted Publishing (nessuna API key a lunga durata):
      #    scambia il token OIDC di GitHub con una API key temporanea.
      #    NUGET_USER = username del profilo nuget.org (non l'email).
      - name: NuGet login (Trusted Publishing)
        if: startsWith(github.ref, 'refs/tags/v')
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet
        if: startsWith(github.ref, 'refs/tags/v')
        run: dotnet nuget push "./packages/*.nupkg" --api-key "${{ steps.nuget_login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      # 10. Estrae le note di rilascio dal CHANGELOG.md
      - name: Extract Release Notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${{ steps.ver.outputs.value }}"
          awk -v ver="$VERSION" '
            BEGIN { p=0 }
            $0 ~ "^<a name=\"" ver "\">" { p=1; next }
            p==1 && /^<a name=/ { p=0 }
            p==1 { print }
          ' CHANGELOG.md > RELEASE_NOTES.md

      # 11. Crea la Release su GitHub con i pacchetti come artefatti
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ./packages/*.nupkg
          prerelease: ${{ steps.ver.outputs.is_prerelease == 'true' }}
          body_path: RELEASE_NOTES.md

  deploy_docs:
    runs-on: ubuntu-latest
    # Deploy docs only from main to keep Pages aligned with the latest branch state.
    # Tag-triggered release runs should not attempt a docs deploy.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
